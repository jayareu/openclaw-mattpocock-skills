name: Check Upstream Staleness

on:
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: check-upstream-staleness
  cancel-in-progress: false

jobs:
  check:
    name: Compare upstream release with lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check upstream lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-upstream-staleness.sh
