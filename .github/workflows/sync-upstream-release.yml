name: Sync Upstream Main

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    name: Watch mattpocock/skills main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          npm ci

      - name: Record original main
        run: echo "SYNC_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Sync latest upstream main
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/sync-upstream-release.sh --main --apply --env-file "$GITHUB_OUTPUT"

      - name: Validate adapter
        if: steps.sync.outputs.UPSTREAM_SYNC_CHANGED == 'true'
        env:
          TAG: ${{ steps.sync.outputs.UPSTREAM_SYNC_TAG }}
        run: |
          npm ci
          npm test
          scripts/validate-mattpocock-skills-openclaw.sh
          scripts/security-scan.sh
          git diff --check
          bash -n scripts/promote-upstream-sync.sh
          scripts/sync-upstream-release.sh --main --expected-sha "${{ steps.sync.outputs.UPSTREAM_SYNC_SHA }}" --env-file "$RUNNER_TEMP/sync-noop.env"
          grep -qx 'UPSTREAM_SYNC_CHANGED=false' "$RUNNER_TEMP/sync-noop.env"

      - name: Push sync branch
        if: steps.sync.outputs.UPSTREAM_SYNC_CHANGED == 'true'
        env:
          TAG: ${{ steps.sync.outputs.UPSTREAM_SYNC_TAG }}
          SHA: ${{ steps.sync.outputs.UPSTREAM_SYNC_SHA }}
        run: |
          branch="sync-upstream-${TAG}"
          if [ "$TAG" = main ]; then branch="sync-upstream-main-$SHA"; fi
          git branch -M "$branch"
          git push --force-with-lease origin "HEAD:$branch"
          echo "SYNC_BRANCH=$branch" >> "$GITHUB_ENV"
          echo "SYNC_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Open or update pull request
        if: steps.sync.outputs.UPSTREAM_SYNC_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.sync.outputs.UPSTREAM_SYNC_TAG }}
          SHA: ${{ steps.sync.outputs.UPSTREAM_SYNC_SHA }}
        run: |
          title="Sync mattpocock/skills ${TAG}"
          body="$(cat <<EOF
          ## Summary

          Sync upstream mattpocock/skills ${TAG} at ${SHA}.

          ## Verification

          The candidate is validated before this workflow pushes the branch or
          opens the pull request.

          - npm test
          - scripts/validate-mattpocock-skills-openclaw.sh
          - scripts/security-scan.sh
          - git diff --check

          Upstream commit: ${SHA}
          EOF
          )"
          if gh pr view "$SYNC_BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$SYNC_BRANCH" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$SYNC_BRANCH" --title "$title" --body "$body"
          fi

      - name: Promote validated upstream main
        if: steps.sync.outputs.UPSTREAM_SYNC_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh pr view "$SYNC_BRANCH" --json number --jq .number)"
          bash scripts/promote-upstream-sync.sh "$pr" "$SYNC_HEAD_SHA" "$SYNC_BASE_SHA"

      - name: Validate current main after sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Report no update
        if: steps.sync.outputs.UPSTREAM_SYNC_CHANGED == 'false'
        run: echo "Already synced to ${{ steps.sync.outputs.UPSTREAM_SYNC_TAG }}."
